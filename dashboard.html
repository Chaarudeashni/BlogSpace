
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">BlogSpace</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <!-- Dashboard Header -->
    <section class="dashboard-header">
        <h1>My Dashboard</h1>
        <p>Manage your blog posts in one place.</p>

        <div class="dashboard-actions">
            <a href="create-blog.html" class="btn">
                + Create New Blog
            </a>
            <a href="index.html" class="btn btn-outline">
                View Website
            </a>
        </div>
    </section>

    <!-- Statistics -->
    <section class="container">
        <div class="blog-card">
            <h3>Total Blog Posts</h3>
            <h1 id="totalPosts">0</h1>
        </div>
    </section>

    <!-- Blog Posts -->
    <section class="container">
        <h2 class="section-title">My Blog Posts</h2>

        <div class="blog-grid" id="dashboardBlogs">
            <!-- Posts displayed using JavaScript -->
        </div>
    </section>

    <footer>
        <p>© 2026 BlogSpace. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
