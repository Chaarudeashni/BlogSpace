
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | Create Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">🅱️BlogSpace</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <!-- Create Blog Form -->
    <div class="blog-editor">

        <h2>Create a New Blog</h2>

        <form id="blogForm">

            <div class="form-group">
                <label>Blog Title</label>
                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="blogCategory"
                    style="width:100%; padding:12px; border:1px solid #ddd; border-radius:7px;"
                    required>

                    <option value="">Select Category</option>
                    <option value="Technology">Technology</option>
                    <option value="Education">Education</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Programming">Programming</option>
                    <option value="Other">Other</option>

                </select>
            </div>

            <div class="form-group">
                <label>Blog Content</label>
                <textarea
                    id="blogContent"
                    rows="10"
                    placeholder="Write your blog content here..."
                    required></textarea>
            </div>

            <button type="submit" class="btn">
                Publish Blog
            </button>

            <p id="blogMessage"></p>

        </form>

    </div>

    <footer>
        <p>© 2026 BlogSpace. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
